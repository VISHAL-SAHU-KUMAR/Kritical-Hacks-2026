services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dueshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: dueshield
    ports:
      - "5432:5432"
    volumes:
      - dueshield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dueshield -d dueshield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dueshield_pgdata:
